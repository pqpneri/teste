<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#078ec8" />
  <title>Transferências entre lojas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="page-header">
      <div class="header-icon" aria-hidden="true">⇆</div>
      <div>
        <h1>Transferências</h1>
        <p>Registro entre lojas</p>
      </div>
    </header>

    <section class="stats-grid" aria-label="Resumo de transferências">
      <article class="stat-card">
        <div class="stat-icon blue">▱</div>
        <div>
          <strong id="totalRegistrado">0</strong>
          <span>Total registrado</span>
        </div>
      </article>
      <article class="stat-card">
        <div class="stat-icon green">✓</div>
        <div>
          <strong id="totalHoje">0</strong>
          <span>Hoje</span>
        </div>
      </article>
    </section>

    <section class="panel">
      <div class="panel-title">
        <span class="panel-title-icon">↔</span>
        <h2>Nova transferência</h2>
      </div>

      <form id="transferForm" novalidate>
        <div class="form-grid origin-row">
          <label class="field">
            <span>Loja de Origem</span>
            <select id="lojaOrigem" required>
              <option value="">Selecione...</option>
              <option>Guararapes</option>
              <option>North Way</option>
              <option>Patteo</option>
              <option>Recife</option>
              <option>RioMar</option>
              <option>Tacaruna</option>
              <option>Quiosque</option>
              <option>Paulista Acessórios</option>
            </select>
          </label>

          <button type="button" id="swapButton" class="swap-button" title="Trocar lojas" aria-label="Trocar loja de origem e loja atual">⇆</button>

          <label class="field">
            <span>Loja Atual</span>
            <select id="lojaAtual" required>
              <option value="">Selecione...</option>
              <option>Guararapes</option>
              <option>North Way</option>
              <option>Patteo</option>
              <option>Recife</option>
              <option>RioMar</option>
              <option>Tacaruna</option>
              <option>Quiosque</option>
              <option>Paulista Acessórios</option>
            </select>
          </label>

          <label class="field quantity-field">
            <span>Quantidade</span>
            <input id="quantidade" type="number" min="1" step="1" placeholder="Ex.: 5" required />
          </label>
        </div>

        <label class="field full-width">
          <span>Produto</span>
          <input id="produto" type="text" placeholder="Ex.: Camiseta azul P" maxlength="120" autocomplete="off" required />
        </label>

        <label class="field full-width">
          <span>Transporte</span>
          <select id="transporte" required>
            <option value="">Selecione...</option>
            <option>Motoboy</option>
            <option>Carro da empresa</option>
            <option>Transportadora</option>
            <option>Retirada em loja</option>
            <option>Outro</option>
          </select>
        </label>

        <label class="field full-width">
          <span>Motivo</span>
          <select id="motivo" required>
            <option value="">Selecione...</option>
            <option value="VENDIDO">VENDIDO</option>
            <option value="REPOSIÇÃO DE ESTOQUE">REPOSIÇÃO DE ESTOQUE</option>
          </select>
        </label>


        <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>

        <div class="form-actions">
          <button class="primary-button" type="submit"><span>＋</span> Registrar transferência</button>
          <button class="whatsapp-button" id="whatsappButton" type="button"><span>◉</span> Gerar mensagem WhatsApp</button>
          <button class="secondary-button" type="reset"><span>⌫</span> Limpar</button>
        </div>
      </form>
    </section>

    <section class="panel history-panel">
      <div class="history-header">
        <div class="panel-title compact">
          <span class="panel-title-icon">☷</span>
          <h2>Histórico</h2>
        </div>
        <div class="history-actions">
          <input id="searchInput" type="search" placeholder="Buscar transferência..." aria-label="Buscar transferência" />
          <button id="exportButton" class="secondary-button small" type="button">Exportar CSV</button>
          <button id="clearHistoryButton" class="danger-button small" type="button">Limpar histórico</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Origem</th>
              <th>Destino</th>
              <th>Produto</th>
              <th>Qtd.</th>
              <th>Transporte</th>
              <th>Motivo</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
        <div id="emptyState" class="empty-state">Nenhuma transferência registrada.</div>
      </div>
    </section>
  </main>

  <dialog id="detailDialog">
    <div class="dialog-header">
      <h3>Detalhes da transferência</h3>
      <button id="closeDialogButton" class="icon-button" aria-label="Fechar">×</button>
    </div>
    <div id="dialogContent" class="dialog-content"></div>
  </dialog>

  <dialog id="whatsappDialog">
    <div class="dialog-header">
      <h3>Relatório para WhatsApp</h3>
      <button id="closeWhatsappDialogButton" class="icon-button" aria-label="Fechar">×</button>
    </div>
    <div class="dialog-content">
      <textarea id="whatsappMessage" class="message-preview" rows="11" readonly></textarea>
      <div class="dialog-actions">
        <button id="copyWhatsappButton" class="secondary-button" type="button">Copiar mensagem</button>
        <button id="openWhatsappButton" class="whatsapp-button" type="button">Abrir no WhatsApp</button>
      </div>
      <div id="copyMessage" class="form-message" aria-live="polite"></div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
